services:
  db:
    image: postgres:16-alpine
    container_name: omoka-db
    environment:
      POSTGRES_USER: omoka
      POSTGRES_PASSWORD: omoka_local_dev_only
      POSTGRES_DB: omoka
    ports:
      - "5432:5432"
    volumes:
      - omoka-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omoka -d omoka"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omoka-db-data:
